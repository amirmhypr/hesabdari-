<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Truck & Accounting Graphic -->
  <g transform="translate(64, 80) scale(0.75)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Truck Cab & Body -->
    <path d="M 40 280 L 40 100 Q 40 70 70 70 L 290 70 Q 310 70 310 90 L 310 280 Z" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff"/>
    <path d="M 310 140 L 400 140 Q 430 140 445 170 L 470 230 Q 480 250 480 280 L 480 280 Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff"/>
    
    <!-- Windshield -->
    <path d="M 330 160 L 400 160 L 440 220 L 330 220 Z" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Chassis & Underbody -->
    <path d="M 20 280 L 500 280" stroke="#ffffff" stroke-width="22"/>
    
    <!-- Wheels -->
    <circle cx="110" cy="295" r="45" fill="#1e293b" stroke="#ffffff" stroke-width="16"/>
    <circle cx="110" cy="295" r="18" fill="url(#goldGrad)" stroke="none"/>
    
    <circle cx="210" cy="295" r="45" fill="#1e293b" stroke="#ffffff" stroke-width="16"/>
    <circle cx="210" cy="295" r="18" fill="url(#goldGrad)" stroke="none"/>

    <circle cx="410" cy="295" r="45" fill="#1e293b" stroke="#ffffff" stroke-width="16"/>
    <circle cx="410" cy="295" r="18" fill="url(#goldGrad)" stroke="none"/>

    <!-- Cargo / Finance Chart Overlay -->
    <polyline points="80,210 140,160 200,180 270,120" stroke="#fbbf24" stroke-width="18" fill="none"/>
    <circle cx="270" cy="120" r="12" fill="#fbbf24"/>
  </g>

  <!-- Persian Typography Tag -->
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="0">حسابداری امیر</text>
</svg>
